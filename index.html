<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Isekai Open World — Mushoku Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:system-ui,-apple-system,sans-serif}
#c{display:block;width:100%;height:100%;background:#1a3a1a}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(0,0,0,.88),rgba(0,0,0,.4),transparent);z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar-wrap{flex:1;min-width:85px;max-width:150px}
.bar-label{font-size:10px;color:#e2e8f0;margin-bottom:2px;font-weight:600;text-shadow:0 1px 2px #000}
.bar{height:11px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar-fill{height:100%;border-radius:5px;transition:width .12s}
.hp-fill{background:linear-gradient(90deg,#dc2626,#ef4444)}
.mp-fill{background:linear-gradient(90deg,#2563eb,#3b82f6)}
.stat{background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px;color:#f1f5f9;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.1);text-shadow:0 1px 2px #000}
.wanted{display:flex;gap:3px;align-items:center}
.star{width:13px;height:13px;background:#334155;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .2s}
.star.on{background:#fbbf24;box-shadow:0 0 6px #f59e0b}
#elemBox{display:flex;gap:4px;align-items:center}
.elem{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid transparent;opacity:.45;transition:all .15s;background:rgba(0,0,0,.4)}
.elem.on{opacity:1;border-color:#fff;transform:scale(1.12);box-shadow:0 0 10px currentColor}
#log{position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:92%;max-width:360px}
.log-msg{background:rgba(15,23,42,.9);color:#fde68a;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;border:1px solid rgba(251,191,36,.35);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .35s,transform .35s;transform:translateY(-6px)}
.log-msg.show{opacity:1;transform:translateY(0)}
#ui{position:absolute;inset:0;z-index:30;pointer-events:none}
#joystick-zone{position:absolute;left:0;bottom:0;width:48%;height:42%;pointer-events:auto}
#joy-base{position:absolute;width:112px;height:112px;border-radius:50%;background:rgba(30,41,59,.42);border:2px solid rgba(148,163,184,.35);left:26px;bottom:max(26px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
#joy-knob{width:50px;height:50px;border-radius:50%;background:rgba(226,232,240,.78);border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.4);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#btns{position:absolute;right:10px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;pointer-events:auto;align-items:flex-end}
.btn{width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.35);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:0 4px 0 rgba(0,0,0,.45);cursor:pointer;transition:transform .05s,box-shadow .05s;text-shadow:0 1px 2px #000}
.btn:active,.btn.active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn-atk{background:radial-gradient(circle at 30% 30%,#7c3aed,#4c1d95)}
.btn-int{background:radial-gradient(circle at 30% 30%,#b45309,#78350f);width:62px;height:62px;font-size:10px}
.btn-dash{background:radial-gradient(circle at 30% 30%,#0e7490,#164e63);width:56px;height:56px;font-size:10px}
.btn-cycle{width:48px;height:48px;font-size:18px;background:radial-gradient(circle at 30% 30%,#334155,#1e293b);border-radius:14px}
#minimap{position:absolute;top:max(8px,env(safe-area-inset-top));right:8px;width:92px;height:72px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:8px;z-index:22;pointer-events:none;overflow:hidden}
@media(max-width:380px){.btn{width:60px;height:60px;font-size:10px}#joy-base{width:96px;height:96px;left:14px}#joy-knob{width:44px;height:44px}.btn-cycle{width:42px;height:42px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <div class="bar-wrap"><div class="bar-label">❤️ HP</div><div class="bar"><div class="bar-fill hp-fill" id="hpBar" style="width:100%"></div></div></div>
    <div class="bar-wrap"><div class="bar-label">💙 MANA</div><div class="bar"><div class="bar-fill mp-fill" id="mpBar" style="width:100%"></div></div></div>
    <div class="stat">⭐ <span id="lvl">1</span></div>
    <div class="stat">💰 <span id="gold">0</span></div>
  </div>
  <div class="row">
    <div class="stat wanted">Inquisición: <div id="stars" class="wanted"></div></div>
    <div id="elemBox" class="stat" style="padding:2px 6px;gap:5px">
      <span class="elem on" data-i="0" style="color:#f97316">🔥</span>
      <span class="elem" data-i="1" style="color:#38bdf8">💧</span>
      <span class="elem" data-i="2" style="color:#a3e635">🌪️</span>
      <span class="elem" data-i="3" style="color:#a8a29e">🪨</span>
      <span class="elem" data-i="4" style="color:#4ade80">✨</span>
    </div>
  </div>
</div>
<div id="log"></div>
<canvas id="minimap" width="92" height="72"></canvas>
<div id="ui">
  <div id="joystick-zone">
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>
  <div id="btns">
    <button class="btn btn-cycle" id="btnCycle" title="Cambiar magia">🔄</button>
    <button class="btn btn-atk" id="btnAtk">🔥 MAGIA</button>
    <button class="btn btn-int" id="btnInt">💰 ROBAR<br>INTERACT</button>
    <button class="btn btn-dash" id="btnDash">💨 DASH</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
