<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c12">
  <title>Top-Down Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud">
      <span id="fps">60 FPS</span>
      <span id="status">Listo</span>
    </div>

    <div id="touch-ui" aria-hidden="true">
      <div id="joy-zone">
        <div id="joy-base">
          <div id="joy-knob"></div>
        </div>
      </div>
      <div id="btn-zone">
        <button type="button" class="btn btn-secondary" id="btn-b" data-action="b">B</button>
        <button type="button" class="btn btn-primary" id="btn-a" data-action="a">A</button>
      </div>
    </div>

    <button type="button" id="btn-fs" title="Pantalla completa">⛶</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
