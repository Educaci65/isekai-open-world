<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>NEON RUSH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#07070c;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
#c{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0 0 auto 0;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));z-index:20;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card{background:rgba(0,0,0,.72);border:1px solid rgba(255,40,110,.5);padding:7px 12px;border-radius:3px;font-weight:800;font-size:12px;letter-spacing:.05em;text-shadow:0 0 8px #ff286e;backdrop-filter:blur(4px)}
.card b{color:#ff286e}
#comboEl{color:#00f5ff;font-size:20px;text-shadow:0 0 12px #00f5ff;line-height:1.1}
#levelTag{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:21;pointer-events:none;font-weight:900;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.85);text-shadow:0 0 10px #ff286e}
#weaponTag{position:absolute;right:14px;bottom:max(118px,env(safe-area-inset-bottom));z-index:26;pointer-events:none;background:rgba(0,0,0,.75);border:1px solid #00f5ff;color:#00f5ff;padding:5px 11px;font-size:11px;font-weight:800;letter-spacing:.08em}
#msg{position:absolute;top:20%;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center;width:92%;max-width:440px}
.msg{font-size:clamp(20px,6vw,32px);font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 0 14px #ff286e,0 0 28px #ff286e;opacity:0;transform:scale(.92);transition:opacity .2s,transform .2s}
.msg.show{opacity:1;transform:scale(1)}
.msg.sub{font-size:13px;color:#00f5ff;text-shadow:0 0 8px #00f5ff;margin-top:8px;font-weight:700;letter-spacing:.12em}
#ui{position:absolute;inset:0;z-index:25;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:46%;height:42%;pointer-events:auto}
#joyBase{position:absolute;width:114px;height:114px;border-radius:50%;border:2px solid rgba(255,40,110,.45);background:rgba(15,8,18,.5);left:18px;bottom:max(20px,env(safe-area-inset-bottom));box-shadow:0 0 20px rgba(255,40,110,.15) inset}
#joyKnob{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b9d,#ff286e);border:2px solid #ff8fb5;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px #ff286e}
#btns{position:absolute;right:12px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:11px;align-items:flex-end;pointer-events:auto}
.abtn{width:70px;height:70px;border-radius:50%;border:2px solid rgba(0,245,255,.55);background:radial-gradient(circle at 30% 30%,#00d4e0,#007a85);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:0 0 16px rgba(0,245,255,.3);cursor:pointer;transition:transform .06s}
.abtn:active,.abtn.on{transform:scale(.9)}
.abtn.hit{border-color:rgba(255,40,110,.6);background:radial-gradient(circle at 30% 30%,#ff5a9a,#9a1040);box-shadow:0 0 16px rgba(255,40,110,.35)}
.abtn.dash{width:56px;height:56px;font-size:9px;border-color:rgba(180,120,255,.55);background:radial-gradient(circle at 30% 30%,#b47fff,#5a28a0);box-shadow:0 0 12px rgba(180,120,255,.3)}
#overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,4,10,.92);text-align:center;padding:24px;transition:opacity .3s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(36px,11vw,64px);color:#ff286e;text-shadow:0 0 24px #ff286e,0 0 48px rgba(255,40,110,.4);letter-spacing:.14em;margin-bottom:6px}
#overlay .tag{color:#00f5ff;font-size:12px;font-weight:700;letter-spacing:.25em;margin-bottom:16px}
#overlay p{color:#9a9ab0;max-width:380px;line-height:1.55;margin:0 0 18px;font-size:14px}
.btn-main{pointer-events:auto;background:linear-gradient(180deg,#ff4d8d,#ff286e);color:#fff;border:none;padding:15px 42px;font-size:15px;font-weight:900;letter-spacing:.14em;cursor:pointer;box-shadow:0 0 24px rgba(255,40,110,.45);border-radius:2px;margin:6px}
.btn-main:active{transform:scale(.97)}
.btn-sec{pointer-events:auto;background:transparent;color:#00f5ff;border:1px solid #00f5ff;padding:10px 24px;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer;margin:4px;border-radius:2px}
.masks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px;pointer-events:auto}
.mask{width:52px;height:52px;border:2px solid #333;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;background:#12121a;transition:border .15s,box-shadow .15s}
.mask.on{border-color:#ff286e;box-shadow:0 0 14px rgba(255,40,110,.5)}
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:28;pointer-events:auto;width:36px;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
#scan{position:absolute;inset:0;z-index:15;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);opacity:.5}
@media(max-width:380px){.abtn{width:60px;height:60px}#joyBase{width:98px;height:98px}.abtn.dash{width:50px;height:50px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan"></div>
<div id="hud">
  <div class="card">SEC <b id="secN">1</b> · KILLS <b id="kills">0</b><br><span style="opacity:.7;font-size:10px">BEST <b id="best">0</b></span></div>
  <div class="card" style="text-align:right">SCORE <b id="score">0</b><div id="comboEl">x1</div></div>
</div>
<div id="levelTag">SECTOR 01</div>
<div id="weaponTag">BAT</div>
<button id="pauseBtn" type="button">⏸</button>
<div id="msg"><div class="msg" id="mainMsg"></div><div class="msg sub" id="subMsg"></div></div>
<div id="ui">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="btns">
    <div class="abtn dash" id="btnDash">💨<br>DASH</div>
    <div class="abtn" id="btnFire">🔫<br>FIRE</div>
    <div class="abtn hit" id="btnHit">⚾<br>HIT</div>
  </div>
</div>
<div id="overlay">
  <h1>NEON RUSH</h1>
  <div class="tag">TOP-DOWN ACTION</div>
  <p>Un golpe te mata. Mátalos a todos. Combos altos. No pares.<br><br>
  <b style="color:#00f5ff">Móvil</b> joystick · HIT · FIRE · DASH<br>
  <b style="color:#00f5ff">PC</b> WASD · click/F · Shift dash</p>
  <div class="masks" id="maskPick">
    <div class="mask on" data-m="0">👹</div>
    <div class="mask" data-m="1">😈</div>
    <div class="mask" data-m="2">👺</div>
    <div class="mask" data-m="3">💀</div>
  </div>
  <button class="btn-main" id="btnStart">JUGAR</button>
  <button class="btn-sec" id="btnHow">CÓMO JUGAR</button>
</div>
<script src="game.js"></script>
</body>
</html>
